<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { --accent: #6d28d9; --muted: var(--figma-color-text-secondary, #6f6789); --line: var(--figma-color-border, #e7e2f6); --bad: #d63c4f; --ok: #15965a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font: 12px/1.45 Inter, system-ui, sans-serif; color: var(--figma-color-text, #1d1533); background: var(--figma-color-bg, #fff); }
  h1 { font-size: 14px; margin: 0 0 2px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
  input { width: 100%; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: inherit; }
  input:focus { outline: none; border-color: var(--accent); }
  button { height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); padding: 0 6px; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .batch { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 8px; }
  .batch b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { margin-top: 12px; white-space: pre-wrap; }
  .err { color: var(--bad); }
  .ok { color: var(--ok); }
  details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-top: 4px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
  <h1>Tokiwa Sell Sheets</h1>
  <p class="muted">Creates the batches sent from the dashboard's Sell Sheets page, copying the “Sell sheet auto” frame.</p>

  <details id="settings">
    <summary>Dashboard connection</summary>
    <label for="url">Dashboard address</label>
    <input id="url" placeholder="https://your-dashboard.vercel.app" />
    <label for="password">Dashboard password</label>
    <input id="password" type="password" placeholder="Leave empty if there is none" />
    <div style="margin-top:10px"><button id="save">Save</button></div>
  </details>

  <hr />
  <div class="row">
    <b>Waiting batches</b>
    <span>
      <button class="ghost" id="refresh">Refresh</button>
      <button id="all" style="display:none">Create all</button>
    </span>
  </div>
  <div id="batches" class="muted" style="margin-top:6px">Loading…</div>
  <div id="status"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let settings = {};
  let batches = [];
  let busy = false;
  let pendingResolve = null;

  const base = () => (settings.url || "").trim().replace(/\/+$/, "");
  const headers = () => (settings.password ? { Authorization: "Basic " + btoa("figma:" + settings.password) } : {});
  const status = (text, cls = "") => { $("status").textContent = text; $("status").className = cls; };

  async function api(path, init = {}) {
    const res = await fetch(base() + path, { ...init, headers: { ...headers(), ...(init.headers || {}) } });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || res.status + " " + res.statusText);
    }
    return res;
  }

  function render() {
    const list = $("batches");
    list.innerHTML = "";
    $("all").style.display = batches.length > 1 ? "" : "none";
    $("all").disabled = busy;
    if (!batches.length) { list.textContent = "Nothing waiting. Send a batch from the dashboard."; return; }
    for (const b of batches) {
      const el = document.createElement("div");
      el.className = "batch row";
      const info = document.createElement("div");
      info.style.minWidth = "0";
      const name = document.createElement("b");
      name.textContent = b.name;
      const meta = document.createElement("span");
      meta.className = "muted";
      meta.textContent = b.count + " sheet" + (b.count === 1 ? "" : "s") + " · " + new Date(b.createdAt).toLocaleString();
      info.append(name, meta);
      const btn = document.createElement("button");
      btn.textContent = "Create";
      btn.disabled = busy;
      btn.onclick = () => run([b]);
      el.append(info, btn);
      list.append(el);
    }
  }

  async function refresh() {
    if (!base()) { $("settings").open = true; $("batches").textContent = "Enter the dashboard address first."; return; }
    try {
      const data = await (await api("/api/hrs/batches")).json();
      batches = data.batches;
      render();
    } catch (e) {
      $("batches").innerHTML = "";
      status("Couldn't reach the dashboard: " + e.message, "err");
      if (/password/i.test(e.message)) $("settings").open = true;
    }
  }

  /** Downloads a batch and its photos, hands them to the plugin, then removes the batch from the dashboard. */
  async function createOne(summary) {
    status("Downloading " + summary.name + "…");
    const batch = await (await api("/api/hrs/batches/" + summary.id)).json();
    const photos = [];
    for (const [i, s] of batch.sheets.entries()) {
      if (!s.photo) { photos.push(null); continue; }
      status("Downloading photo " + (i + 1) + " of " + batch.sheets.length + "…");
      photos.push(new Uint8Array(await (await api("/api/hrs/batches/" + batch.id + "/photos/" + s.photo.index)).arrayBuffer()));
    }
    const result = await new Promise((resolve) => {
      pendingResolve = resolve;
      parent.postMessage({ pluginMessage: { type: "create", batch, photos } }, "*");
    });
    if (result.type === "failed") throw new Error(result.error);
    await api("/api/hrs/batches/" + batch.id, { method: "DELETE" }).catch(() => {});
    return result;
  }

  async function run(list) {
    busy = true; render();
    const lines = [];
    let failed = false;
    for (const b of list) {
      try {
        const r = await createOne(b);
        lines.push("✓ " + b.name + ": " + r.count + " sheet" + (r.count === 1 ? "" : "s") + " created", ...r.warnings.map((w) => "  • " + w));
      } catch (e) {
        failed = true;
        lines.push("✗ " + b.name + ": " + e.message);
      }
    }
    busy = false;
    status(lines.join("\n"), failed ? "err" : "ok");
    refresh();
  }

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    if (msg.type === "settings") {
      settings = msg.settings || {};
      $("url").value = settings.url || "";
      $("password").value = settings.password || "";
      refresh();
    } else if (msg.type === "progress") {
      status(msg.text);
    } else if ((msg.type === "created" || msg.type === "failed") && pendingResolve) {
      pendingResolve(msg);
      pendingResolve = null;
    }
  };

  $("save").onclick = () => {
    settings = { url: $("url").value.trim(), password: $("password").value };
    parent.postMessage({ pluginMessage: { type: "save-settings", settings } }, "*");
    $("settings").open = false;
    status("");
    refresh();
  };
  $("refresh").onclick = refresh;
  $("all").onclick = () => run(batches);
  parent.postMessage({ pluginMessage: { type: "load-settings" } }, "*");
</script>
</body>
</html>
